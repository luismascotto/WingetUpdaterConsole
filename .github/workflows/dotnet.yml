name: .NET Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore Consoler/Consoler.sln
    
    - name: Build
      run: dotnet build Consoler/Consoler.sln --configuration Release --no-restore
    
    - name: Test
      run: dotnet test Consoler/Consoler.sln --configuration Release --no-build --verbosity normal
